# Configuración del proyecto para análisis estático con SonarQube / SonarScanner
sonar.projectKey=mediclinic
sonar.projectName=MediClinic - Sistema de Gestion Clinica
sonar.projectVersion=1.0

# Rutas de código fuente a analizar
sonar.sources=mediclinic,run.py
sonar.sourceEncoding=UTF-8

# Versión de Python
sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14

# Exclusiones (evitar analizar base de datos, caché y temporales)
sonar.exclusions=**/*.db,**/__pycache__/**,**/*.csv,**/*.json,*.txt,*.md
